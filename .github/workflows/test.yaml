name: Tests

on:
  # test in isolation
  push:
  # test as-merged
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]  # PYVERSIONS

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: true
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

    - name: pytest  # also runs mypy
      run: |
        uv run --python ${{ matrix.python-version }} --no-sync pytest
